# Commits run only checks scoped to the staged files; the Release build runs at pre-push.
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "end-of-file-fixer", exclude = "^src/Yamv\\.App/Web/vendor/", stages = ["pre-commit"] },
  { id = "trailing-whitespace", exclude = "(\\.md$|^src/Yamv\\.App/Web/vendor/)", stages = ["pre-commit"] },
  { id = "check-merge-conflict" },
]

# C# hooks: the fixers run and re-stage at commit, the warnings-as-errors build gates the push.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "dotnet-format-style"
name = "dotnet format style (info)"
entry = "pwsh tools/hooks/dotnet-format-wrapper.ps1 style"
language = "system"
types = ["c#"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "csharpier"
name = "dotnet csharpier format"
entry = "pwsh tools/hooks/csharpier-wrapper.ps1"
language = "system"
types = ["c#"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "dotnet-build"
name = "dotnet build (warnings as errors)"
entry = "pwsh -NoProfile -File tools/gate.ps1 run --log .tmp/hook-build.log --slot heavy --timeout 600 -- dotnet build Yamv.slnx -c Release"
language = "system"
pass_filenames = false
# A push of Markdown alone has nothing to build.
exclude = '\.md$'
stages = ["pre-push"]
