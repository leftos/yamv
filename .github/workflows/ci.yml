name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Yamv.slnx -c Release

      - name: Test
        run: dotnet test --solution Yamv.slnx -c Release --no-build

      - name: Publish win-x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/publish.ps1 -Rid win-x64

      - name: Upload yamv-win-x64.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yamv-win-x64.exe
          path: publish/win-x64/yamv.exe
          if-no-files-found: error

      - name: Publish osx-arm64 and build YAMV.app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pwsh scripts/publish.ps1 -Rid osx-arm64
          bash scripts/make-app.sh publish/osx-arm64 dist
          codesign --verify --deep --strict dist/YAMV.app
          ditto -c -k --keepParent dist/YAMV.app dist/YAMV-osx-arm64.app.zip

      - name: Upload YAMV-osx-arm64.app.zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YAMV-osx-arm64.app.zip
          path: dist/YAMV-osx-arm64.app.zip
          archive: false
          if-no-files-found: error
